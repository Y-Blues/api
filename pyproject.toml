[project]
name = "ycappuccino-api"
version = "0.1.0"
description = "YCappuccino interfaces shared by the framework and the bundles"
requires-python = ">=3.10"
dependencies = [
    "iPOPO>=3.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ycappuccino.api"
module-root = "src/main/python"
